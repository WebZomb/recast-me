name: Finish approved orbit header crop
on:
  push:
    branches: [recast/approved-orbit-brand-2026-10-06]
permissions:
  contents: write
jobs:
  validate-header:
    if: startsWith(github.event.head_commit.message, 'prepare:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Fetch exact branding revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Use clean approved wordmark crop
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const old='recastmeai-approved-orbit-header-v1.png?v=1791313673';
          const next='recastmeai-approved-orbit-header-v2.png?v=1791314310';
          for(const p of ['public/index.html','public/order.html','public/support.html','scripts/apply-orbit-brand-v1.mjs','docs/ASTRA-BRAND-ORBIT-2026-10-06.md']){
            const s=readFileSync(p,'utf8');
            if(!s.includes(old))throw new Error('Expected old header source missing in '+p);
            writeFileSync(p,s.replaceAll(old,next));
          }
          const p='docs/ASTRA-BRAND-ORBIT-2026-10-06.md';
          writeFileSync(p,readFileSync(p,'utf8')+'\n## Header asset refinement\nLocal visual inspection found a small stray swirl fragment at the left edge of the first horizontal crop. Header v2 uses the approved stacked wordmark crop instead and retains the same 691x144 intrinsic dimensions. No letter shapes were regenerated. The earlier CDN file is no longer referenced by deployed HTML. Preparation validation at 1d46d1b: 178 tests passed, zero failures, Wrangler dry-run passed (run 37517306354). The first follow-up preparation workflow at 0788fbf failed YAML parsing before execution due to a colon-space in an unquoted condition. This was corrected to the known working prepare-prefix condition; it did not alter production or application behavior. Rerun the same checks after this reference-only correction.\n');
          JS
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Bundle only
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/recast-orbit-brand-finish
      - name: Commit validated image references and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'WebZomb'
          git config user.email '97362504+WebZomb@users.noreply.github.com'
          git rm .github/workflows/recast-orbit-brand-finish.yml
          git add public scripts docs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'validate: use final approved orbit header crop'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/recast/approved-orbit-brand-2026-10-06
          git rev-parse HEAD
