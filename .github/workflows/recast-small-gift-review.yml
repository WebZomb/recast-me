name: Recast small-gift visual release evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/shop-small-gift-release.js'
      - 'scripts/small-gift-review-export.mjs'
      - '.github/workflows/recast-small-gift-review.yml'
permissions:
  contents: read
concurrency:
  group: recast-small-gift-evidence
  cancel-in-progress: false
jobs:
  evidence:
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_READY == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Classify authorized storage-read failure without exposing values
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {existsSync,rmSync} from 'node:fs';
          const file='/tmp/recast-proof-diagnostic.json';
          const cli='node_modules/wrangler/bin/wrangler.js';
          const r=spawnSync(process.execPath,[cli,'r2','object','get','recast-me-artwork/shop/preparation/coasters/v1/golden-retriever-4pack.json','--remote','--file',file],{encoding:'utf8',timeout:45000});
          const text=String(r.stdout||'')+' '+String(r.stderr||'');
          console.log(JSON.stringify({exitCode:r.status,cliExists:existsSync(cli),downloaded:existsSync(file),providerCodes:[...text.matchAll(/code[:\s]+([0-9]{3,7})/gi)].map(m=>m[1]),authentication:/authentication|unauthorized|forbidden/i.test(text),permission:/permission|scope/i.test(text),missingObject:/not found|does not exist|not exist/i.test(text),badArgument:/unknown argument|unrecognized/i.test(text),missingModule:/cannot find module/i.test(text),configError:/configuration|config file/i.test(text)}));
          if(existsSync(file))rmSync(file);
          JS
      - run: node --check scripts/small-gift-review-export.mjs
      - run: node scripts/small-gift-review-export.mjs
      - name: Retain only commercial images and sanitized review hashes
        uses: actions/upload-artifact@v4
        with:
          name: recast-small-gift-visual-review
          path: small-gift-review-evidence/
          retention-days: 1
          if-no-files-found: error
