# Current deployment token cannot read R2 objects. Do not retry automatically
# or alter its permissions. The existing authenticated owner Control Center
# provides the supported review path for native print files.
name: Recast small-gift visual release evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recast-small-gift-evidence
  cancel-in-progress: false
jobs:
  evidence:
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_READY == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/small-gift-review-export.mjs
      - run: node scripts/small-gift-review-export.mjs
      - name: Retain only commercial images and sanitized review hashes
        uses: actions/upload-artifact@v4
        with:
          name: recast-small-gift-visual-review
          path: small-gift-review-evidence/
          retention-days: 1
          if-no-files-found: error
