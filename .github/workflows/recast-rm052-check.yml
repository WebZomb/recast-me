name: Recast RM052 isolated checks
on:
  push:
    branches: [recast/rm052-product-studio]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recast-rm052-isolated
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  source-and-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - name: Fetch exact public source without credentials
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/rm052-evidence
          git rev-parse HEAD > /tmp/rm052-evidence/preparation-commit.txt
      - name: Verify and apply previously tested source delta
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          paths = sorted(pathlib.Path('scripts').glob('rm052-payload-*.b64'))
          assert len(paths) == 5, 'Expected exactly five source-delta chunks'
          encoded = ''.join(p.read_text().strip() for p in paths)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '97d1250e28096fadc673be52c34069ffb80c3c98a0d12c0b60ea88da7efa4d50', digest
          pathlib.Path('/tmp/rm052-evidence/source-delta.sha256').write_text(digest + '\n')
          pathlib.Path('/tmp/rm052.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/rm052.patch
          git apply --unidiff-zero /tmp/rm052.patch
          git diff --check
          rm scripts/rm052-payload-*.b64 .github/workflows/recast-rm052-check.yml
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full mocked tests and Worker bundle without deployment
        run: |
          npm test | tee /tmp/rm052-evidence/node-tests.txt
          npx --no-install wrangler deploy --dry-run --outdir /tmp/rm052-bundle | tee /tmp/rm052-evidence/bundle.txt
      - name: Install isolated raster and browser test tools
        run: |
          mkdir -p /tmp/rm052-tools
          cd /tmp/rm052-tools
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.57.0 sharp@0.34.1
          npx playwright install --with-deps chromium webkit > /tmp/rm052-evidence/browser-install.txt 2>&1
      - name: Actual raster transparency and protected-watermark checks
        run: NODE_PATH=/tmp/rm052-tools/node_modules node scripts/rm052-pixel-tests.cjs | tee /tmp/rm052-evidence/pixel-checks.txt
      - name: WebKit and Chromium product-preview regressions
        run: NODE_PATH=/tmp/rm052-tools/node_modules node scripts/rm052-browser-tests.cjs | tee /tmp/rm052-evidence/product-browser-checks.txt
      - name: Preserve existing quality and owner-control browser policies
        run: NODE_PATH=/tmp/rm052-tools/node_modules node scripts/rm050-browser-tests.cjs | tee /tmp/rm052-evidence/policy-browser-checks.txt
      - name: Record observed results and publish validated source to isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          log = pathlib.Path('/tmp/rm052-evidence/node-tests.txt').read_text()
          count = re.findall(r'^# pass (\d+)$', log, re.M)
          assert count and re.search(r'^# fail 0$', log, re.M), 'Missing passing Node result'
          doc = pathlib.Path('docs/ASTRA-SESSION-RM-052.md')
          doc.write_text(doc.read_text() + '\n\n## Observed isolated CI validation\nRun ' + os.environ['GITHUB_RUN_ID'] + ' applied and verified source-delta SHA256 97d1250e28096fadc673be52c34069ffb80c3c98a0d12c0b60ea88da7efa4d50 against preparation commit ' + os.environ['GITHUB_SHA'] + '. All ' + count[-1] + ' full Node tests passed with zero failures; Wrangler dry-run, three raster-finishing checks, WebKit 393 / Chromium 320 and 1440 product-browser checks, and the existing RM050 credit/owner-policy browser checks passed. Providers and writes were mocked; no live segmentation, Printful generation, purchase, or fulfillment was performed. This validated source is published only to the isolated branch; production promotion and live verification are separate. The resulting exact application commit is recorded in the rm052-validation artifact and workflow log.\n')
          PY
          git diff --check
          git add -u
          git add src public tests scripts/rm052-browser-tests.cjs scripts/rm052-pixel-tests.cjs docs/ASTRA-HANDOFF.md docs/ASTRA-SESSION-RM-052.md
          git diff --cached --stat
          git config user.name 'WebZomb'
          git config user.email '97362504+WebZomb@users.noreply.github.com'
          git commit -m "validate: RM052 transparent apparel and product studio"
          git rev-parse HEAD | tee /tmp/rm052-evidence/application-commit.txt
          git archive --format=zip HEAD -o /tmp/rm052-evidence/validated-source.zip
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/recast/rm052-product-studio
      - name: Retain checks and synthetic example screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm052-validation
          path: |
            /tmp/rm052-evidence/
            rm052-browser-results/
            rm052-pixel-results/
            rm050-browser-results/
          retention-days: 7
          if-no-files-found: warn
