name: Discover Printful expansion candidates
on:
  push:
    branches: [recast/rm0512-theme-library-product-mapping-2026-10-06]
permissions:
  contents: read
jobs:
  discover:
    if: contains(github.event.head_commit.message, 'catalog-discovery:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Samsung case pricing
        shell: bash
        run: |
          curl -fsSL --retry 3 "https://api.printful.com/products/267" -o /tmp/product.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/product.json')).get('result',{})
          print('PRODUCT',d.get('product',{}).get('title'))
          for v in d.get('variants',[]):
              r=v.get('availability_regions') or []
              if v.get('in_stock') and 'US' in r and any(x in (v.get('name') or '') for x in ['S23','S24','S25']):
                  print('US_VARIANT',v.get('id'),v.get('name'),'price='+str(v.get('price')))
          PY
