name: Discover Printful expansion candidates
on:
  push:
    branches: [recast/rm0512-theme-library-product-mapping-2026-10-06]
permissions:
  contents: read
jobs:
  discover:
    if: contains(github.event.head_commit.message, 'catalog-discovery:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect chosen Printful candidates
        shell: bash
        run: |
          set -euo pipefail
          for id in 358 181 83 867 84 902 534; do
            curl -fsSL --retry 3 "https://api.printful.com/products/$id" -o "/tmp/product-$id.json"
            curl -fsSL --retry 3 "https://api.printful.com/mockup-generator/printfiles/$id" -o "/tmp/printfiles-$id.json"
            python - "$id" <<'PY'
          import json,sys
          ident=sys.argv[1]
          d=json.load(open(f'/tmp/product-{ident}.json')).get('result',{})
          p=d.get('product',{})
          print(f"PRODUCT {ident}: {p.get('title')} | files={[f.get('type') for f in p.get('files',[])]}")
          for v in d.get('variants',[]):
              regions=v.get('availability_regions') or []
              if v.get('in_stock') and 'US' in regions:
                  print(f"  US_VARIANT {v.get('id')} | {v.get('name')} | price={v.get('price')} | retail={v.get('retail_price')}")
          pf=json.load(open(f'/tmp/printfiles-{ident}.json')).get('result',{})
          print("  PRINTFILES",[(x.get('printfile_id'),x.get('width'),x.get('height'),x.get('dpi')) for x in pf.get('printfiles',[])])
          first=(pf.get('variant_printfiles') or [None])[0]
          if first: print("  SAMPLE_PLACEMENTS",first.get('variant_id'),first.get('placements'))
          PY
          done
