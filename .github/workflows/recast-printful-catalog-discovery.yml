name: Discover Printful expansion candidates
on:
  push:
    branches: [recast/rm0512-theme-library-product-mapping-2026-10-06]
permissions:
  contents: read
jobs:
  discover:
    if: contains(github.event.head_commit.message, 'catalog-discovery:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print selected catalog images
        shell: bash
        run: |
          set -euo pipefail
          for id in 358 181 83 867 84 534; do
            curl -fsSL --retry 3 "https://api.printful.com/products/$id" -o "/tmp/product-$id.json"
            python - "$id" <<'PY'
          import json,sys
          ident=sys.argv[1]
          p=(json.load(open(f'/tmp/product-{ident}.json')).get('result') or {}).get('product') or {}
          print(f"CATALOG_IMAGE {ident} {p.get('title')} {p.get('image')}")
          PY
          done
