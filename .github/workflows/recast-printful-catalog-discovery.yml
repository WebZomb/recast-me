name: Discover Printful expansion candidates
on:
  push:
    branches: [recast/rm0512-theme-library-product-mapping-2026-10-06]
permissions:
  contents: read
jobs:
  discover:
    if: contains(github.event.head_commit.message, 'catalog-discovery:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public Printful catalog candidates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://api.printful.com/products -o /tmp/products.json
          python - <<'PY'
          import json,re
          data=json.load(open('/tmp/products.json'))
          items=data.get('result',{})
          if isinstance(items,dict): items=items.get('products',[])
          terms=re.compile(r'(sticker|phone case|pillow|notebook|journal|bandana|puzzle|tote)',re.I)
          matches=[p for p in items if terms.search(str(p.get('title','')))]
          print('PRINTFUL_CANDIDATES_BEGIN')
          for p in matches:
              print(f"{p.get('id')}\t{p.get('title')}\tvariants={p.get('variant_count')}\ttype={p.get('type')}")
          print('PRINTFUL_CANDIDATES_END')
          print('candidate_count',len(matches))
          open('/tmp/candidate_ids.txt','w').write('\n'.join(str(p['id']) for p in matches[:40]))
          PY
      - name: Fetch candidate variants
        shell: bash
        run: |
          set -euo pipefail
          echo PRINTFUL_VARIANTS_BEGIN
          while read -r id; do
            [ -n "$id" ] || continue
            curl -fsSL --retry 2 "https://api.printful.com/products/$id" -o "/tmp/product-$id.json"
            python - "$id" <<'PY'
          import json,sys
          ident=sys.argv[1]
          d=json.load(open(f'/tmp/product-{ident}.json')).get('result',{})
          product=d.get('product',{})
          variants=d.get('variants',[])
          print(f"PRODUCT {ident}: {product.get('title')} | files={[f.get('type') for f in product.get('files',[])]}")
          for v in variants[:30]:
              regions=','.join(v.get('availability_regions') or [])
              print(f"  VARIANT {v.get('id')} | {v.get('name')} | retail={v.get('retail_price')} | in_stock={v.get('in_stock')} | regions={regions}")
          PY
          done < /tmp/candidate_ids.txt
          echo PRINTFUL_VARIANTS_END
