name: Prepare Printful reference and edge-runtime fixes
on:
  push:
    branches: [recast/rm0504-printful-reference-runtime-2026-10-06]
permissions:
  contents: write
jobs:
  prepare:
    if: startsWith(github.event.head_commit.message, 'prepare:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Fetch exact public revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Apply bounded integration changes
        run: |
          node scripts/apply-rm0504.mjs
          node --check src/workflow.js
          node --check public/printful-diagnostics.js
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete tests including workerd with external network blocked
        run: npm test
      - name: Bundle without deployment
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/recast-rm0504
      - name: Publish validated branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'WebZomb'
          git config user.email '97362504+WebZomb@users.noreply.github.com'
          git rm .github/workflows/recast-rm0504-prepare.yml scripts/apply-rm0504.mjs scripts/append-commerce-rm0504.txt
          git add src public tests docs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'validate: integrate Printful reference and edge-runtime fixes'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/recast/rm0504-printful-reference-runtime-2026-10-06
          git rev-parse HEAD
