name: Prepare approved orbit branding
on:
  push:
    branches: [recast/approved-orbit-brand-2026-10-06]
permissions:
  contents: write
jobs:
  prepare-and-validate:
    if: startsWith(github.event.head_commit.message, 'prepare:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Fetch exact authorized baseline and branding preparation
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Apply only approved branding to static HTML
        run: |
          # The prepared PNG was measured in the container at 691 x 144.
          sed -i 's/580/691/g' scripts/apply-orbit-brand-v1.mjs public/brand-orbit-v1.css tests/orbit-brand.test.mjs
          node scripts/apply-orbit-brand-v1.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full mocked suite with branding regressions
        run: npm test
      - name: Bundle without deploying or contacting live providers
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/recast-orbit-brand-bundle
      - name: Remove one-shot workflow and commit validated static changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'WebZomb'
          git config user.email '97362504+WebZomb@users.noreply.github.com'
          git rm .github/workflows/recast-orbit-brand-prep.yml
          git add public scripts tests docs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'validate: apply approved RM orbit logos across the website'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/recast/approved-orbit-brand-2026-10-06
          git rev-parse HEAD
