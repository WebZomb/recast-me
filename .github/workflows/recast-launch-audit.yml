name: Recast read-only launch audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recast-launch-audit.yml'
      - 'public/**'
      - 'src/**'
      - 'scripts/launch-audit.cjs'
      - 'tests/**'
      - 'package*.json'
      - 'wrangler.jsonc'
permissions:
  contents: read
jobs:
  public-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Fetch exact revision without credentials
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Test and bundle without deploying
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test > /tmp/recast-test-results.txt 2>&1 || { cat /tmp/recast-test-results.txt; exit 1; }
          tail -15 /tmp/recast-test-results.txt
          npx --no-install wrangler deploy --dry-run --outdir /tmp/recast-audit-bundle
      - name: Install isolated browser audit dependencies
        run: |
          mkdir -p /tmp/recast-browser
          cd /tmp/recast-browser
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit > /tmp/browser-install.txt 2>&1
      - name: Audit public production only, no purchases or generation
        run: |
          mkdir -p audit-results
          NODE_PATH=/tmp/recast-browser/node_modules node scripts/launch-audit.cjs
      - name: Retain public screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recast-public-launch-audit
          path: audit-results/
          retention-days: 7
