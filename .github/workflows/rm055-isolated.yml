name: RM055 isolated product accuracy
on:
  push:
    branches: [recast/rm055-product-accuracy]
permissions:
  contents: write
concurrency:
  group: rm055-isolated
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Fetch exact public source
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/rm055-evidence
          git rev-parse HEAD > /tmp/rm055-evidence/preparation-commit.txt
      - name: Verify and apply locally tested source delta
        run: |
          python3 - <<'PY'
          import pathlib, base64, gzip, hashlib
          chunks = sorted(pathlib.Path('scripts').glob('rm055-payload-*.b64'))
          assert len(chunks) == 8
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '3a07d968c81c0829caa44b1979312a0ad64320a6f82c689b233ac84ea6b5bcdf', digest
          pathlib.Path('/tmp/rm055.patch').write_bytes(patch)
          pathlib.Path('/tmp/rm055-evidence/source-delta.sha256').write_text(digest + '\n')
          PY
          git apply --check --unidiff-zero /tmp/rm055.patch
          git apply --unidiff-zero /tmp/rm055.patch
          git diff --check
          rm scripts/rm055-payload-*.b64 .github/workflows/rm055-isolated.yml
      - name: Full locked tests and dry-run only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test | tee /tmp/rm055-evidence/tests.txt
          npx --no-install wrangler deploy --dry-run --outdir /tmp/rm055-bundle | tee /tmp/rm055-evidence/bundle.txt
      - name: Isolated browser and raster test tools
        run: |
          mkdir -p /tmp/rm055-tools
          cd /tmp/rm055-tools
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.57.0 sharp@0.34.1
          npx playwright install --with-deps chromium webkit > /tmp/rm055-evidence/browser-install.txt 2>&1
      - name: Pixel transparency and v6 apparel geometry checks
        run: NODE_PATH=/tmp/rm055-tools/node_modules node scripts/rm052-pixel-tests.cjs | tee /tmp/rm055-evidence/pixels.txt
      - name: WebKit and Chromium product regressions
        run: NODE_PATH=/tmp/rm055-tools/node_modules node scripts/rm052-browser-tests.cjs | tee /tmp/rm055-evidence/product-browser.txt
      - name: Credit and owner policy browser regressions
        run: NODE_PATH=/tmp/rm055-tools/node_modules node scripts/rm050-browser-tests.cjs | tee /tmp/rm055-evidence/policy-browser.txt
      - name: Publish validated application to isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          log = pathlib.Path('/tmp/rm055-evidence/tests.txt').read_text()
          count = re.findall(r'^# pass (\d+)$', log, re.M)
          assert count and re.search(r'^# fail 0$', log, re.M)
          doc = pathlib.Path('docs/ASTRA-SESSION-RM-055.md')
          doc.write_text(doc.read_text() + '\n\n## Observed full isolated CI validation\nRun ' + os.environ['GITHUB_RUN_ID'] + ' validated exact source delta 3a07d968c81c0829caa44b1979312a0ad64320a6f82c689b233ac84ea6b5bcdf. All ' + count[-1] + ' full Node tests passed with zero failures. Wrangler dry-run, actual PNG pixel checks, WebKit/Chromium product fixtures and existing owner/credit policy fixtures passed. These checks mocked providers and did not create orders or live mockups. The application commit is recorded in the rm055-validated artifact. Production promotion and real public-sample generation remain separate.\n')
          PY
          git add -u
          git add src public tests scripts/rm055-public-examples.cjs docs/ASTRA-SESSION-RM-055.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'WebZomb'
          git config user.email '97362504+WebZomb@users.noreply.github.com'
          git commit -m "validate: RM055 product accuracy and public samples"
          git rev-parse HEAD | tee /tmp/rm055-evidence/application-commit.txt
          git archive --format=zip HEAD -o /tmp/rm055-evidence/validated-source.zip
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/recast/rm055-product-accuracy
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm055-validated
          path: |
            /tmp/rm055-evidence/
            rm052-pixel-results/
            rm052-browser-results/
            rm050-browser-results/
          retention-days: 7
          if-no-files-found: warn
