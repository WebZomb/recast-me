name: Recast RM-050 validation
on:
  push:
    branches: [recast/rm050-simple-flow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Fetch exact public revision without credentials
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Archive only tracked public source
        run: git archive --format=tar -o /tmp/recast-source.tar HEAD
      - name: Public source for reproducible local validation
        uses: actions/upload-artifact@v4
        with:
          name: recast-rm050-source
          path: /tmp/recast-source.tar
          retention-days: 3
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run mocked tests
        run: npm test
      - name: Bundle only, never deploy
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/recast-bundle
