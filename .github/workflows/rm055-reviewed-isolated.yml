name: RM055 reviewed example validation
on:
  push:
    branches: [recast/rm055-reviewed-examples]
permissions:
  contents: write
concurrency:
  group: rm055-reviewed-examples
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Exact public source
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          mkdir -p /tmp/rm055-reviewed
      - name: Verified source delta
        run: |
          python3 - <<'PY'
          import pathlib, gzip, base64, hashlib
          chunks = sorted(pathlib.Path('scripts').glob('rm055-reviewed-payload-*.b64'))
          assert len(chunks) == 3
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'a922ef599e96e4ed122e46ee62873c004b78a5a2fb9b62eac26863e2294a73db', digest
          pathlib.Path('/tmp/rm055-reviewed.patch').write_bytes(patch)
          pathlib.Path('/tmp/rm055-reviewed/delta.sha256').write_text(digest + '\n')
          PY
          git apply --check /tmp/rm055-reviewed.patch
          git apply /tmp/rm055-reviewed.patch
          git diff --check
          rm scripts/rm055-reviewed-payload-*.b64 .github/workflows/rm055-reviewed-isolated.yml
      - name: Full tests and bundle only
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test | tee /tmp/rm055-reviewed/tests.txt
          npx --no-install wrangler deploy --dry-run --outdir /tmp/rm055-reviewed-bundle | tee /tmp/rm055-reviewed/bundle.txt
      - name: Browser fixtures with mocked providers
        run: |
          mkdir -p /tmp/rm055-tools
          cd /tmp/rm055-tools
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.57.0 sharp@0.34.1
          npx playwright install --with-deps chromium webkit > /tmp/rm055-reviewed/browser-install.txt 2>&1
          cd "${GITHUB_WORKSPACE}"
          NODE_PATH=/tmp/rm055-tools/node_modules node scripts/rm052-browser-tests.cjs | tee /tmp/rm055-reviewed/browser.txt
          NODE_PATH=/tmp/rm055-tools/node_modules node scripts/rm050-browser-tests.cjs | tee /tmp/rm055-reviewed/policy.txt
      - name: Publish validated source to isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib, re, os
          log=pathlib.Path('/tmp/rm055-reviewed/tests.txt').read_text()
          count=re.findall(r'^# pass (\d+)$',log,re.M)
          assert count and re.search(r'^# fail 0$',log,re.M)
          doc=pathlib.Path('docs/ASTRA-RM055-EXAMPLE-REVIEW.md')
          doc.write_text(doc.read_text()+'\n## Observed isolated CI\nRun '+os.environ['GITHUB_RUN_ID']+' verified the exact delta and passed '+count[-1]+' Node tests, Wrangler dry-run, WebKit/Chromium product fixtures, and owner/credit fixtures. Providers were mocked in these checks. The earlier real sample run and its inspected images are separate evidence. Live sample publication is checked by the existing production audit plus the new read-only sample-image audit after main promotion.\n')
          PY
          git add -u
          git add scripts/rm055-published-example-audit.cjs docs/ASTRA-RM055-EXAMPLE-REVIEW.md
          git diff --cached --check
          git config user.name 'WebZomb'
          git config user.email '97362504+WebZomb@users.noreply.github.com'
          git commit -m "validate: RM055 publish reviewed exact-variant examples"
          git rev-parse HEAD | tee /tmp/rm055-reviewed/commit.txt
          git archive --format=zip HEAD -o /tmp/rm055-reviewed/source.zip
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/recast/rm055-reviewed-examples
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm055-reviewed-validation
          path: |
            /tmp/rm055-reviewed/
            rm052-browser-results/
            rm050-browser-results/
          retention-days: 7
