name: Recast iOS compile check
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', '.github/workflows/recast-ios.yml']
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Fetch exact source revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and compile for simulator (no signing or upload)
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project RecastMe.xcodeproj -scheme RecastMe -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/recast-ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Verify packaged app resources
        run: |
          RECAST_APP=/tmp/recast-ios-build/Build/Products/Debug-iphonesimulator/RecastMe.app
          test -s "$RECAST_APP/Assets.car"
          plutil -lint "$RECAST_APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$RECAST_APP/Info.plist" | grep -x AppIcon
      - name: Capture real app screens on iPhone and iPad
        run: |
          set -eu
          mkdir -p /tmp/recast-store-shots
          xcrun simctl list devices available -j > /tmp/recast-devices.json
          python3 - <<'PY'
          import json
          devices = [d for ds in json.load(open('/tmp/recast-devices.json'))['devices'].values() for d in ds]
          wanted = [('iphone', 'iPhone 17 Pro Max'), ('ipad', 'iPad Pro 13-inch (M5)')]
          with open('/tmp/recast-screenshot-devices.txt', 'w') as output:
              for label, name in wanted:
                  matches = [d for d in devices if d['name'] == name]
                  if not matches and label == 'ipad':
                      matches = [d for d in devices if d['name'].startswith('iPad Pro 13-inch')]
                  if not matches:
                      raise SystemExit('Required screenshot simulator unavailable: ' + name)
                  output.write(label + ' ' + matches[-1]['udid'] + '\n')
          PY
          while read -r RECAST_DEVICE_KIND RECAST_DEVICE_ID; do
            xcrun simctl boot "$RECAST_DEVICE_ID" || true
            xcrun simctl bootstatus "$RECAST_DEVICE_ID" -b
            xcrun simctl status_bar "$RECAST_DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcodebuild -project ios/RecastMe.xcodeproj -scheme RecastStoreScreenshots -destination "platform=iOS Simulator,id=$RECAST_DEVICE_ID" -derivedDataPath /tmp/recast-ios-build -resultBundlePath "/tmp/recast-store-shots/$RECAST_DEVICE_KIND.xcresult" CODE_SIGNING_ALLOWED=NO test
            xcrun xcresulttool export attachments --path "/tmp/recast-store-shots/$RECAST_DEVICE_KIND.xcresult" --output-path "/tmp/recast-store-shots/$RECAST_DEVICE_KIND"
            xcrun simctl shutdown "$RECAST_DEVICE_ID"
          done < /tmp/recast-screenshot-devices.txt
      - name: Preserve screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recast-store-screenshots
          path: /tmp/recast-store-shots
          retention-days: 14
