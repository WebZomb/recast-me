name: Read-only Siamese Christmas mug source hold audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recast-siamese-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-v3-immutable-holds:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read only four fixed private R2 metadata paths, never raw artwork or credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          paths=(
            "shop/preparation/v3/village-siamese-cat-mug-11oz.json"
            "shop/preparation/v3/village-siamese-cat-mug-15oz.json"
            "shop/preparation/v3/source-christmas-village-siamese-cat.claim"
            "requests/RC-SHOP-SIAMESE-CAT-V1/request.json"
          )
          for i in "${!paths[@]}"; do
            if npx --no-install wrangler r2 object get "recast-me-artwork/${paths[$i]}" --remote --file "$RUNNER_TEMP/siamese-$i.json" > "$RUNNER_TEMP/siamese-$i.stderr" 2>&1; then
              echo "SIAMESE_R2_GET_$i=ok"
              touch "$RUNNER_TEMP/siamese-$i.ok"
            else
              echo "SIAMESE_R2_GET_$i=failed"
            fi
          done
      - name: Report only safe metadata presence, status and provider-task flags
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const dir=process.env.RUNNER_TEMP||os.tmpdir();
          const labels=['11oz_status','15oz_status','source_claim','source_metadata'];
          const check=(v)=>typeof v==='string'&&/^[a-z0-9_]{1,60}$/i.test(v)?v:'redacted';
          for(let i=0;i<4;i++){
            const file=path.join(dir,'siamese-'+i+'.json'),log=path.join(dir,'siamese-'+i+'.stderr');
            if(!fs.existsSync(path.join(dir,'siamese-'+i+'.ok'))){
              const error=fs.existsSync(log)?fs.readFileSync(log,'utf8'):'';
              const category=/not found|does not exist|404|no such key/i.test(error)?'missing':/auth|permission|forbidden|access denied|not authorized|invalid token|403|401|10000/i.test(error)?'access_denied':/unknown arguments|command not found|unexpected argument|invalid option/i.test(error)?'cli_usage':'other_failure';
              const numeric=error.match(/\\b(?:code|error)\\s*[:#]?\\s*(\\d{3,6})\\b/i)?.[1]||'none';
              console.log(labels[i].toUpperCase()+'_ERROR_CODE='+numeric);
              console.log(labels[i].toUpperCase()+'_READ='+category);
              continue;
            }
            let d;try{d=JSON.parse(fs.readFileSync(file,'utf8'))}catch{console.log(labels[i].toUpperCase()+'_READ=non_json');continue}
            console.log(labels[i].toUpperCase()+'_READ=ok');
            if(i<2){
              console.log(labels[i].toUpperCase()+'_STATE='+check(String(d.status||'none')));
              console.log(labels[i].toUpperCase()+'_CODE='+check(String(d.code??'none')));
              console.log(labels[i].toUpperCase()+'_HAS_SUPPLIER_ID='+Boolean(d.mockupId||d.taskId||d.printfulTaskId||d.providerTaskId));
              console.log(labels[i].toUpperCase()+'_HAS_PROOF='+Boolean(d.proofHash||d.reviewSignature||d.printFileHash));
            } else if(i===2) {
              console.log('SOURCE_CLAIM_HAS_TIMESTAMP='+Number.isFinite(Date.parse(d.startedAt||'')));
            } else {
              console.log('SOURCE_META_IDENTITY_MATCH='+(d.source==='premade-catalog'&&d.catalogDesignId==='christmas-village-siamese-cat'&&d.catalogMasterHash==='3afbbac01b6fd3e16f1888a20f4b52855dca45949895f286a14126cdde4956ef'));
              console.log('SOURCE_META_HAS_ACCESS_TOKEN='+Boolean(d.accessToken));
            }
          }
          NODE
