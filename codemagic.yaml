# Start manually after completing docs/IOS-TESTFLIGHT-SETUP.md.
# No push/PR trigger and no public App Store submission.
workflows:
  recast-internal-testflight:
    name: Recast Me — internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Starveil Codemagic
    environment:
      xcode: 26.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.recastme.ios
    scripts:
      - name: Validate release prerequisites
        script: |
          set -eu
          test -f ios/RecastMe/Assets.xcassets/AppIcon.appiconset/Contents.json || {
            echo 'App icon is not packaged yet. Finish the release prerequisites before signing.'
            exit 1
          }
          test -f ios/RecastMe/PrivacyInfo.xcprivacy || {
            echo 'Privacy manifest review and packaging are still required.'
            exit 1
          }
      - name: Generate the Xcode project
        script: |
          set -eu
          command -v xcodegen >/dev/null || brew install xcodegen
          cd ios
          xcodegen generate
      - name: Set a unique build number
        script: |
          set -eu
          # Check the highest Apple build and explicitly select an unused number.
          RECAST_COUNTER="${RECAST_NEXT_BUILD_NUMBER:?Set a verified unused Apple build number above 1001}"
          case "$RECAST_COUNTER" in *[!0-9]*|'') exit 1 ;; esac
          RECAST_BUILD_NUMBER="$RECAST_COUNTER"
          test "$RECAST_BUILD_NUMBER" -gt 1001
          test "$RECAST_BUILD_NUMBER" -le 9999 || {
            echo 'Review the Apple build-number range before uploading.'
            exit 1
          }
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RECAST_BUILD_NUMBER" ios/RecastMe/Info.plist
      - name: Apply signing for internal testing only
        script: |
          set -eu
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Archive the iPhone app
        script: |
          set -eu
          xcode-project build-ipa --project ios/RecastMe.xcodeproj --scheme RecastMe
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  recast-app-store-release:
    name: Recast Me — App Store distribution
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Starveil Codemagic
    environment:
      xcode: 26.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.recastme.ios
    scripts:
      - name: Validate release source
        script: |
          set -eu
          test -s ios/RecastMe/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ios/RecastMe/PrivacyInfo.xcprivacy
          test -s ios/RecastMe/PhotoConsentView.swift
      - name: Generate the release project
        script: |
          set -eu
          command -v xcodegen >/dev/null || brew install xcodegen
          cd ios
          xcodegen generate
      - name: Set distribution build number
        script: |
          set -eu
          RECAST_COUNTER="${RECAST_NEXT_BUILD_NUMBER:?Set a verified unused Apple build number above 1001}"
          case "$RECAST_COUNTER" in *[!0-9]*|'') exit 1 ;; esac
          RECAST_RELEASE_BUILD="$RECAST_COUNTER"
          test "$RECAST_RELEASE_BUILD" -gt 1001
          test "$RECAST_RELEASE_BUILD" -le 9999
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RECAST_RELEASE_BUILD" ios/RecastMe/Info.plist
      - name: Apply App Store signing
        script: |
          set -eu
          xcode-project use-profiles
      - name: Archive for App Store Connect
        script: |
          set -eu
          xcode-project build-ipa --project ios/RecastMe.xcodeproj --scheme RecastMe
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload the eligible binary; submit in App Store Connect after metadata,
        # actual screenshots, privacy labels and storefront checks are complete.
        submit_to_testflight: false
        submit_to_app_store: false
