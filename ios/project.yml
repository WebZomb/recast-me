name: RecastMe
options:
  bundleIdPrefix: com.recastme
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.recastme.ios
    SUPPORTS_MACCATALYST: NO
targets:
  RecastMe:
    type: application
    platform: iOS
    sources: [RecastMe]
    info:
      path: RecastMe/Info.plist
      properties:
        CFBundleDisplayName: Recast Me
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Take a photo you choose to transform into a Recast.
        ITSAppUsesNonExemptEncryption: false
schemes:
  RecastMe:
    build:
      targets:
        RecastMe: all
