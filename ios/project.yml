name: RecastMe
options:
  bundleIdPrefix: com.recastme
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '11'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.recastme.ios
    SUPPORTS_MACCATALYST: NO
targets:
  RecastMe:
    type: application
    platform: iOS
    sources: [RecastMe]
    info:
      path: RecastMe/Info.plist
      properties:
        CFBundleDisplayName: Recast Me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Take a photo you choose to transform into a Recast.
        ITSAppUsesNonExemptEncryption: false
  RecastStoreScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [RecastStoreScreenshots]
    dependencies:
      - target: RecastMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recastme.ios.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RecastMe
schemes:
  RecastMe:
    build:
      targets:
        RecastMe: all
  RecastStoreScreenshots:
    build:
      targets:
        RecastMe: all
        RecastStoreScreenshots: [test]
    test:
      targets: [RecastStoreScreenshots]
